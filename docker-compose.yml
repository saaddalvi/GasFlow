# Local development database. Hosted environments use Neon.
name: gasflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gasflow
      POSTGRES_PASSWORD: gasflow
      POSTGRES_DB: gasflow
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasflow -d gasflow -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
